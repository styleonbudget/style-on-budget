name: Import wardrobe visuals

on:
  push:
    paths:
      - ".github/workflows/import-wardrobe-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wardrobe images
        run: |
          mkdir -p images/wardrobe-staples
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3ADOPBnAn0M6pEEKt4Mqoah0mWs/646ce44b-206f-4672-a65a-7883e5e7a928.jpg" -o images/wardrobe-staples/wardrobe-staples-hero.jpg
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3ADOPBnAn0M6pEEKt4Mqoah0mWs/e51b3dc1-2b86-49b3-8e2f-177cef8a6200.jpg" -o images/wardrobe-staples/staple-jeans.jpg
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3ADOPBnAn0M6pEEKt4Mqoah0mWs/c3d9dd19-5d00-4e6b-8c7d-517d1874dbc2.jpg" -o images/wardrobe-staples/staple-white-tshirt-flatlay.jpg
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3ADOPBnAn0M6pEEKt4Mqoah0mWs/64857859-2442-4200-a102-1d6fef8ad29e.jpg" -o images/wardrobe-staples/staple-blazer.jpg
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3ADOPBnAn0M6pEEKt4Mqoah0mWs/724139eb-d9ba-4e77-a353-7cbc78382335.jpg" -o images/wardrobe-staples/staple-black-dress.jpg
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3ADOPBnAn0M6pEEKt4Mqoah0mWs/84b3f2fa-c464-4cbb-9652-f4ef882a0f91.jpg" -o images/wardrobe-staples/staple-white-sneakers.jpg
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3ADOPBnAn0M6pEEKt4Mqoah0mWs/84d40952-8766-443a-9089-987f3e8cf643.jpg" -o images/wardrobe-staples/staple-neutral-coat.jpg
          curl -fL "https://d2ol7oe51mr4n9.cloudfront.net/user_3ADOPBnAn0M6pEEKt4Mqoah0mWs/7a0d0a4a-8fb6-45ec-8cd2-7e132efddbde.jpg" -o images/wardrobe-staples/staple-handbag.jpg

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/wardrobe-staples
          git commit -m "Add wardrobe staples visuals [skip ci]"
          git push
